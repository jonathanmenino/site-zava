<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
@font-face{font-family:"Range";src:url("/cases/bravus/4f4a7c696dc5146b518a99f74c37360b.ttf") format("truetype");font-display:swap}
