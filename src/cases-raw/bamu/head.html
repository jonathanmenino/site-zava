<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@400;600;800&amp;display=swap">
<style>
body{margin:0;background:#FFF6E5}
.bm{--coral:#E5655C;--azul:#68BFDD;--amarelo:#FBD657;--pink:#E6007E;--roxo:#7A1FC9;--creme:#FFF6E5;--tinta:#2E3A66;--coral-texto:#B8433A;font-family:Nunito,sans-serif;color:var(--tinta);background:var(--creme)}
.bm *{box-sizing:border-box}
.bm .wrap{max-width:1200px;margin:0 auto;padding:0 40px;position:relative}
.bm section{position:relative;overflow:hidden}
.bm .fl{position:absolute;pointer-events:none;transform:rotate(var(--r));animation:flut 6s ease-in-out infinite;z-index:1}
@keyframes flut{0%,100%{translate:0 0}50%{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.bm .fl{animation:none}}
.bm .disp{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05}
.bm .num{margin:0;font-family:"Lilita One",sans-serif;font-size:20px;letter-spacing:.04em;color:var(--coral-texto)}
.bm h2{margin:12px 0 0;font-family:"Lilita One",sans-serif;font-weight:400;font-size:52px;line-height:1.05;color:var(--tinta);max-width:18ch;text-wrap:balance}
.bm p{line-height:1.7}
.bm .pad{padding:112px 0}
.bm .lead{font-size:19px;max-width:34rem;margin:28px 0 0}
.bm .ficha{margin:36px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;padding-top:24px;border-top:2px dashed rgba(46,58,102,.25)}
.bm .ficha dt{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-texto)}
.bm .ficha dd{margin:4px 0 0;font-weight:600;font-size:15px;line-height:1.45}
.bm .heroreel{display:block;width:100%;max-width:360px;margin:0 auto;aspect-ratio:9/16;object-fit:cover;border-radius:36px;border:8px solid #fff;box-shadow:0 30px 60px -25px rgba(46,58,102,.45);transform:rotate(3deg);background:#fff}
.bm .blob{position:absolute;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;z-index:0}
.bm .duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:64px}
.bm .azul{background:var(--azul);color:var(--tinta)}
.bm .azul .num{color:var(--tinta)}
.bm .fim{background:var(--tinta);color:#fff}
.bm .fim h2{color:#fff}
.bm .fim .btn{background:var(--amarelo);color:var(--tinta)}
.bm .attrs{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:12px}
.bm .attrs li{background:#fff;border-radius:999px;padding:14px 24px;display:flex;flex-direction:column;align-items:center;line-height:1}
.bm .a1{font-family:"Lilita One",sans-serif;font-size:20px;color:var(--tinta)}
.bm .a2{font-family:"Lilita One",sans-serif;font-size:24px;color:var(--coral)}
.bm .cores{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:20px;font-weight:800}
.bm .cores li{display:flex;align-items:center;gap:10px}
.bm .cores span{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(46,58,102,.2)}
.bm .banner{display:block;width:100%;border-radius:28px;margin-top:48px;box-shadow:0 30px 60px -30px rgba(46,58,102,.45)}
.bm .palco{margin-top:48px;border-radius:40px;background:#fff;padding:96px 64px;display:grid;place-items:center;position:relative;overflow:hidden}
.bm .palco img.lg{width:100%;max-width:820px;position:relative;z-index:2}
.bm .sub{margin:72px 0 0;font-family:"Lilita One",sans-serif;font-size:22px;color:var(--tinta)}
.bm .paleta{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:14px}
.bm .paleta li{background:#fff;border-radius:24px;overflow:hidden}
.bm .sw{display:block;height:96px}
.bm .paleta div{padding:14px 18px 18px}
.bm .cn{margin:0;font-weight:800}.bm .ch{margin:2px 0 0;font-size:13px;color:#5a6488}.bm .cu{margin:6px 0 0;font-size:13px;line-height:1.5}
.bm .tipo{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px}
.bm .tipo > div{background:#fff;border-radius:28px;padding:36px}
.bm .els{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:14px}
.bm .els li{background:#fff;border-radius:28px;aspect-ratio:1;display:grid;place-items:center;padding:22px}
.bm .els img{max-width:100%;max-height:100%;transform:rotate(var(--r))}
.bm .trilho{list-style:none;margin:24px 0 0;padding:0 0 20px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory}
.bm .trilho{scrollbar-width:thin;scrollbar-color:var(--coral) rgba(255,255,255,.55)}
.bm .trilho::-webkit-scrollbar{height:10px}
.bm .trilho::-webkit-scrollbar-track{background:rgba(255,255,255,.55);border-radius:999px;margin:0 4px}
.bm .trilho::-webkit-scrollbar-thumb{background:var(--coral);border-radius:999px;border:2px solid rgba(255,255,255,.55)}
.bm .trilho::-webkit-scrollbar-thumb:hover{background:var(--roxo)}
.bm .trilho li{flex:0 0 auto;scroll-snap-align:start}
.bm .trilho img{display:block;height:400px;width:auto;border-radius:24px}
.bm .reels{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:40px 32px}
.bm .reels video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:32px;background:#000;box-shadow:0 30px 60px -30px rgba(46,58,102,.45)}
.bm .lt{margin:16px 0 0;font-family:"Lilita One",sans-serif;font-size:26px;line-height:1.2}
.bm .ls{margin:4px 0 0;font-size:16px;line-height:1.4}
.bm .motion{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:56px;align-items:center}
.bm .motion video{display:block;width:100%;max-width:320px;aspect-ratio:9/16;border-radius:32px;margin:0 auto;box-shadow:0 30px 60px -30px rgba(46,58,102,.45)}
.bm .btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 28px;border-radius:999px;background:var(--tinta);color:#fff;font-family:"Lilita One",sans-serif;font-size:18px;text-decoration:none}
.bm a:focus-visible,.bm video:focus-visible{outline:3px solid var(--roxo);outline-offset:3px}

/* Celular: margens menores e tipos que cabem na tela. */
@media (max-width:760px){
  .bm .trilho img{height:320px}
  .bm .wrap{padding:0 20px}.bm .pad{padding:72px 0}.bm h2{font-size:36px}
  .bm .palco{padding:48px 20px;border-radius:28px}
  .bm p[style*="font-size:96px"]{font-size:72px!important}.bm p[style*="font-size:44px"]{font-size:32px!important}
  /* Elementos flutuantes somem no celular: não há espaço lateral e eles cobriam o texto. */
  .bm .fl{display:none}
  .bm .wrap{z-index:2}
}
</style>
