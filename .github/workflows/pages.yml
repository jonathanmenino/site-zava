# Publica uma prévia do site no GitHub Pages (https://jonathanmenino.github.io/site-zava/)
# a cada push na branch do redesign ou na main. O site oficial continua em agenciazava.com.br.
name: Prévia no GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-2bkr1f]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          # A prévia não tem PHP: os formulários enviam pelo FormSubmit.
          PUBLIC_FORM_ENDPOINT: https://formsubmit.co/ajax/contato@agenciazava.com.br
      - run: node scripts/pages-base.mjs dist /${{ github.event.repository.name }}
      - name: Publica na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Prévia: ${{ github.sha }}"
